<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Вход — Фотоконтур</title>
<link rel="icon" href="/fotokontur-preview/favicon.svg" type="image/svg+xml">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#141414;
    background:linear-gradient(to top,#e5e5e7 42.719%,#b5d5ea 101.48%)}
  body.wait form{visibility:hidden}
  form{width:100%;max-width:400px;padding:40px 32px;background:#fff;border-radius:24px}
  img{display:block;height:36px;width:auto;margin-bottom:28px}
  h1{font-size:24px;line-height:30px;font-weight:500;letter-spacing:-.01em}
  p{margin-top:8px;font-size:14px;line-height:20px;color:#5c6672}
  input{width:100%;height:48px;margin-top:24px;padding:0 16px;border:1px solid #c9ced6;border-radius:14px;font:inherit;font-size:16px;outline:none}
  input:focus{border-color:#477bef}
  button{width:100%;height:48px;margin-top:12px;border:0;border-radius:99px;color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer;
    background:linear-gradient(180deg,#477bef 0%,#73a4f2 100%);transition:transform .2s}
  button:hover{background:linear-gradient(180deg,#2f66e8 0%,#5b93f0 100%);transform:translateY(-2px)}
  .err{display:none;margin-top:12px;color:#e5484d}
  .bad .err{display:block}
</style>
</head>
<body class="wait">
<form id="f" autocomplete="on">
  <img src="/fotokontur-preview/logo.png" alt="Фотоконтур" width="241" height="53">
  <h1>Доступ по паролю</h1>
  <p>Прототип сайта Фотоконтур</p>
  <input type="password" id="pw" name="password" autocomplete="current-password" placeholder="Пароль" aria-label="Пароль" required>
  <button type="submit">Войти</button>
  <p class="err" role="alert">Неверный пароль</p>
</form>
<script>
(() => {
  const P = "tHJeJn8SWRoDkmXN8RgZF6mw6kbULm1ewLcRojKTULf1HBtBeUIDe2YTm6y5wDBe2CUNMXx5sv/TWdJEEMf6WHNFUYB8J8oIZuMCEXay/9QtVGbD6y78xf6Ce1+4QOQwL9SuA49h3ExcBDhS3QJ5vJyOzcceL2LNysHRr2MxMNu+C4PQv+WSxll/7T1K2fNUedMZUaHr+3eCqvqdcGsBdFNtQB4nZI+0lysxWkaJhqkiTkkr4hYXMNd4Plx4UFwQ2iZHHXUHijUdHOC+eyEF8Z9/N5g70PCOQNnz7+RlWRr00up5IoJSPfYGYbPV1ujjboT6R2eM6vFBevt4zJ5dwvsVVRPkOc0AqFBuuHKsuQ5qAn90/bwmXxHaeuSJEYRgt+ud6j6E9xZ0P1jucCuAT/NiGeeVf17AFqtADUYi6SSfxGk7k80vCdJ5yIjdXxs=", S = "kp+vqZhpTnTtdNxu4w7EDg==", N = 300000, KID = "fk-key:kp+vqZhpTnTtdNxu4w7EDg==";
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)), e = u => btoa(String.fromCharCode(...new Uint8Array(u)));
  const open = async raw => {
    const k = await crypto.subtle.importKey('raw', b(raw), 'AES-GCM', false, ['decrypt']), d = b(P);
    const h = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: d.slice(0, 12) }, k, d.slice(12)));
    localStorage.setItem(KID, raw);
    document.open(); document.write(h); document.close();
  };
  // страницу выводим только после разбора формы: document.open во время разбора не заменяет документ, а вливает страницу в него
  const start = () => {
    const saved = localStorage.getItem(KID);
    (saved ? open(saved) : Promise.reject()).catch(() => { localStorage.removeItem(KID); document.body.classList.remove('wait'); document.getElementById('pw').focus(); });
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
  document.getElementById('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    const f = ev.target, pw = document.getElementById('pw').value;
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    const raw = e(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b(S), iterations: N, hash: 'SHA-256' }, base, 256));
    try { await open(raw); } catch (err) { f.classList.add('bad'); }
  });
})();
</script>
</body>
</html>
