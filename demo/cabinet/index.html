  <!-- демо на сайте (правка заказчика 05.11.2026): поиск в «Фотосессиях» короче (275 вместо 320) — иначе фильтр «Учреждение» уезжал за край -->
  <style>.ps-page__cal-search-wrap,.ps-page__cal-search-wrap.filter-field_single{flex:0 0 275px!important;width:275px!important;min-width:275px!important}</style>
  <!-- демо на сайте (правка заказчика 05.11.2026): в «Заказах» фильтры, не влезающие в строку, сворачиваются в кнопку-воронку,
       как в «Фотосессиях»; кнопка раскрывает их все. В самом прототипе такого нет — кнопка «Фильтр» там только у суперадмина -->
  <style>.fk-hide{display:none!important}</style>
  <script>
  (function(){
    var raf=0;
    function fit(){
      raf=0;
      var row=document.querySelector('.ord-page__filters');if(!row)return;
      var btn=row.querySelector('.fk-filter-btn');
      if(!btn){
        btn=document.createElement('button');btn.type='button';btn.className='ord-page__cfg-btn fk-filter-btn';
        btn.setAttribute('aria-label','Все фильтры');btn.title='Все фильтры';btn.innerHTML='<i class="pi pi-filter"></i>';
        btn.addEventListener('click',function(){row.classList.toggle('fk-open');fit()});
        row.appendChild(btn);
      }
      var kids=[].slice.call(row.children);
      var fields=kids.filter(function(c){return c!==btn&&c!==kids[0]&&c.classList.contains('filter-field')});
      var open=row.classList.contains('fk-open');
      btn.classList.toggle('ord-page__cfg-btn_active',open);
      fields.forEach(function(f){f.classList.remove('fk-hide')});
      btn.classList.remove('fk-hide');
      if(open)return;
      var top=kids[0].offsetTop+20,hidden=0;   // +20: кнопка ниже поля на несколько пикселей из-за выравнивания по центру
      for(var i=fields.length-1;i>=0;i--){
        var wrapped=fields.some(function(f){return!f.classList.contains('fk-hide')&&f.offsetTop>top})||btn.offsetTop>top;
        if(!wrapped)break;
        fields[i].classList.add('fk-hide');hidden++;
      }
      if(!hidden)btn.classList.add('fk-hide');
    }
    function later(){if(!raf)raf=requestAnimationFrame(fit)}
    new MutationObserver(later).observe(document.documentElement,{childList:true,subtree:true});
    addEventListener('resize',later);
  })();
  </script>

  <body>
    <div id="app"></div>
